name: Build InsBots

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (default: v0.20.3)'
        required: false
        default: 'v0.20.3'
        type: string

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Resolve Version Tag (Auto-generate UTC timestamp if blank)
  # ============================================================================
  prepare-version:
    name: Resolve Version Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version_step.outputs.tag }}
    steps:
      - name: Generate Version Tag
        id: version_step
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v0.20.3_${TIMESTAMP}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved release tag: ${TAG}"

  # ============================================================================
  # 2. Build Windows (x86) -> .zip
  # ============================================================================
  build-windows:
    name: Build Windows (x86)
    runs-on: windows-latest

    steps:
      - name: Checkout InsBots Repository
        uses: actions/checkout@v4

      - name: Checkout HL2SDK (Episode 1)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: episode1
          path: hl2sdk

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build insbots.dll
        shell: pwsh
        env:
          HL2SDK: ${{ github.workspace }}\hl2sdk
        run: |
          .\compile_msvc.bat

      - name: Setup SourceMod & Compile Companion Plugin
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sm.alliedmods.net/smdrop/1.11/sourcemod-1.11.0-git6968-windows.zip" -OutFile "sourcemod.zip"
          Expand-Archive -Path "sourcemod.zip" -DestinationPath "sm_temp"
          & "sm_temp\addons\sourcemod\scripting\spcomp.exe" -i"sm_temp\addons\sourcemod\scripting\include" insbots_companion.sp -o"insbots_companion.smx"

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "pkg_win/addons/sourcemod/plugins" -Force | Out-Null
          Copy-Item -Path "insbots.dll" -Destination "pkg_win/addons/"
          Copy-Item -Path "insbots.vdf" -Destination "pkg_win/addons/"
          Copy-Item -Path "insbots_companion.smx" -Destination "pkg_win/addons/sourcemod/plugins/"
          Copy-Item -Path "README.md" -Destination "pkg_win/"

          # Create .zip package for Windows
          Compress-Archive -Path "pkg_win/*" -DestinationPath "insbots-windows-x86.zip" -Force

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insbots-windows-x86-package
          path: insbots-windows-x86.zip

  # ============================================================================
  # 3. Build Linux (i486) -> .tar.gz
  # ============================================================================
  build-linux:
    name: Build Linux (i486)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout InsBots Repository
        uses: actions/checkout@v4

      - name: Checkout HL2SDK (Episode 1)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: episode1
          path: hl2sdk

      - name: Install 32-bit Multilib Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build insbots_i486.so
        run: |
          make -C linux SDK="${{ github.workspace }}/hl2sdk"

      - name: Setup SourceMod & Compile Companion Plugin
        run: |
          wget "https://sm.alliedmods.net/smdrop/1.11/sourcemod-1.11.0-git6968-linux.tar.gz" -O sourcemod.tar.gz
          tar -xzf sourcemod.tar.gz
          chmod +x addons/sourcemod/scripting/spcomp
          addons/sourcemod/scripting/spcomp -iaddons/sourcemod/scripting/include insbots_companion.sp -o insbots_companion.smx

      - name: Prepare Linux Package (.tar.gz)
        run: |
          mkdir -p pkg_linux/addons/sourcemod/plugins
          cp insbots_i486.so pkg_linux/addons/
          cp insbots.vdf pkg_linux/addons/
          cp insbots_companion.smx pkg_linux/addons/sourcemod/plugins/
          cp README.md pkg_linux/

          # Create .tar.gz package for Linux
          tar -czf insbots-linux-i486.tar.gz -C pkg_linux .

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insbots-linux-i486-package
          path: insbots-linux-i486.tar.gz

  # ============================================================================
  # 4. Optional Release Publisher
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [prepare-version, build-windows, build-linux]
    if: ${{ inputs.create_release == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: insbots-windows-x86-package
          path: release_assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: insbots-linux-i486-package
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          name: ${{ needs.prepare-version.outputs.release_tag }}
          prerelease: ${{ inputs.is_prerelease }}
          make_latest: true
          body: |
            ### What's New in v0.20.3:
            * **Grenade & Smoke Weapon-Switch Crash Fixed:** Bots switching to thrown ordnance could crash the server. INS:MIC registers the carried item (`weapon_m18`) and its thrown projectile (`grenade_m18`) as separate server classes with different vtable sizes, and the old lookup accepted the projectile; handing it to the game's weapon-switch call read past the end of its vtable. The lookup now only accepts genuine carried items, so bots switch grenades and smoke safely.
            * **Bot Weapon Inventory Bound Corrected:** The carried-weapon scan was using the engine SDK's 48-slot constant, but INS:MIC players actually hold 7. The overscan read past the end of the inventory array into adjacent player fields and could resolve a garbage handle to a live weapon. The bound is now 7, verified against both the Linux and Windows game binaries.

          files: |
            release_assets/insbots-windows-x86.zip
            release_assets/insbots-linux-i486.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
