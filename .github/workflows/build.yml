name: Build InsBots

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release with artifacts'
        required: false
        default: false
        type: boolean
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release Tag (default: v0.21.0)'
        required: false
        default: 'v0.21.0'
        type: string

permissions:
  contents: write

jobs:
  # ============================================================================
  # 1. Resolve Version Tag (Auto-generate UTC timestamp if blank)
  # ============================================================================
  prepare-version:
    name: Resolve Version Tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version_step.outputs.tag }}
    steps:
      - name: Generate Version Tag
        id: version_step
        run: |
          TIMESTAMP=$(date -u +'%Y%m%d_%H%M%S')
          if [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v0.21.0_${TIMESTAMP}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Resolved release tag: ${TAG}"

  # ============================================================================
  # 2. Build Windows (x86) -> .zip
  # ============================================================================
  build-windows:
    name: Build Windows (x86)
    runs-on: windows-latest

    steps:
      - name: Checkout InsBots Repository
        uses: actions/checkout@v4

      - name: Checkout HL2SDK (Episode 1)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: episode1
          path: hl2sdk

      - name: Setup MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Build insbots.dll
        shell: pwsh
        env:
          HL2SDK: ${{ github.workspace }}\hl2sdk
        run: |
          .\compile_msvc.bat

      - name: Setup SourceMod & Compile Companion Plugin
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://sm.alliedmods.net/smdrop/1.11/sourcemod-1.11.0-git6968-windows.zip" -OutFile "sourcemod.zip"
          Expand-Archive -Path "sourcemod.zip" -DestinationPath "sm_temp"
          & "sm_temp\addons\sourcemod\scripting\spcomp.exe" -i"sm_temp\addons\sourcemod\scripting\include" insbots_companion.sp -o"insbots_companion.smx"

      - name: Prepare Windows Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "pkg_win/addons/sourcemod/plugins" -Force | Out-Null
          New-Item -ItemType Directory -Path "pkg_win/addons/sourcemod/translations" -Force | Out-Null
          Copy-Item -Path "insbots.dll" -Destination "pkg_win/addons/"
          Copy-Item -Path "insbots.vdf" -Destination "pkg_win/addons/"
          Copy-Item -Path "insbots_companion.smx" -Destination "pkg_win/addons/sourcemod/plugins/"
          Copy-Item -Path "translations/insbots_companion.phrases.txt" -Destination "pkg_win/addons/sourcemod/translations/"
          Copy-Item -Path "README.md" -Destination "pkg_win/"
          Copy-Item -Path "LICENSE" -Destination "pkg_win/"

          # Create .zip package for Windows
          Compress-Archive -Path "pkg_win/*" -DestinationPath "insbots-windows-x86.zip" -Force

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insbots-windows-x86-package
          path: insbots-windows-x86.zip

  # ============================================================================
  # 3. Build Linux (i486) -> .tar.gz
  # ============================================================================
  build-linux:
    name: Build Linux (i486)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout InsBots Repository
        uses: actions/checkout@v4

      - name: Checkout HL2SDK (Episode 1)
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: episode1
          path: hl2sdk

      - name: Install 32-bit Multilib Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build insbots_i486.so
        run: |
          make -C linux SDK="${{ github.workspace }}/hl2sdk"

      - name: Setup SourceMod & Compile Companion Plugin
        run: |
          wget "https://sm.alliedmods.net/smdrop/1.11/sourcemod-1.11.0-git6968-linux.tar.gz" -O sourcemod.tar.gz
          tar -xzf sourcemod.tar.gz
          chmod +x addons/sourcemod/scripting/spcomp
          addons/sourcemod/scripting/spcomp -iaddons/sourcemod/scripting/include insbots_companion.sp -o insbots_companion.smx

      - name: Prepare Linux Package (.tar.gz)
        run: |
          mkdir -p pkg_linux/addons/sourcemod/plugins
          mkdir -p pkg_linux/addons/sourcemod/translations
          cp insbots_i486.so pkg_linux/addons/
          cp insbots.vdf pkg_linux/addons/
          cp insbots_companion.smx pkg_linux/addons/sourcemod/plugins/
          cp translations/insbots_companion.phrases.txt pkg_linux/addons/sourcemod/translations/
          cp README.md pkg_linux/
          cp LICENSE pkg_linux/

          # Create .tar.gz package for Linux
          tar -czf insbots-linux-i486.tar.gz -C pkg_linux .

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: insbots-linux-i486-package
          path: insbots-linux-i486.tar.gz

  # ============================================================================
  # 4. Optional Release Publisher
  # ============================================================================
  publish-release:
    name: Publish Release
    needs: [prepare-version, build-windows, build-linux]
    if: ${{ inputs.create_release == true }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # softprops/action-gh-release creates LIGHTWEIGHT tags, which do not carry a
      # tagger or date. Every other release tag in this repo (v0.19.24, v0.20.0,
      # v0.20.1) is annotated, and v0.20.3 was lightweight only because this action
      # made it. Creating the annotated tag here FIRST means the release step below
      # reuses the existing tag instead of creating its own lightweight one.
      - name: Create Annotated Tag
        env:
          TAG: ${{ needs.prepare-version.outputs.release_tag }}
          TARGET: ${{ github.sha }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          existing=$(git ls-remote --tags origin "refs/tags/${TAG}")
          if [ -n "$existing" ]; then
            # An annotated tag has a peeled "^{}" line; a lightweight tag does not.
            peeled=$(git ls-remote --tags origin "refs/tags/${TAG}^{}")
            if [ -n "$peeled" ]; then
              echo "Tag ${TAG} already exists and is annotated; leaving it untouched."
            else
              echo "::warning::Tag ${TAG} already exists but is LIGHTWEIGHT, not annotated. Leaving it as-is; delete the tag and re-run to replace it with an annotated one."
            fi
          else
            git tag -a "${TAG}" "${TARGET}" -m "${TAG}"
            git push origin "refs/tags/${TAG}"
            echo "Created annotated tag ${TAG} at ${TARGET}."
          fi
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: insbots-windows-x86-package
          path: release_assets

      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: insbots-linux-i486-package
          path: release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.release_tag }}
          name: ${{ needs.prepare-version.outputs.release_tag }}
          prerelease: ${{ inputs.is_prerelease }}
          make_latest: true
          body: |
            ### What's New in v0.21.0:
            * **Humvee M249 Auto-Turrets:** Roof-mounted Humvees now carry an autonomous M249 that scans 360 degrees, acquires visible enemies, and fires at the M249's full 800 RPM with the player weapon's gunshot sound, spread, and red tracers. The turret arms for the team of the first player to sit in the driver seat, keeps defending after the driver dies, and shuts down when the truck is destroyed. Full admin control: `insbot turret status / add / register / remove / set`.
            * **Round-Freeze Gate & Team Pre-Registration:** Turrets can be pre-registered to a team before anyone boards (`insbot turret register`), and stay dormant through the pre-round freeze window so a preset truck can never fire on players still locked in spawn (`turret_freeze_gate`).
            * **Bot Anti-Vehicle Combat & Steering:** Bots now treat hostile Humvees as targets (`target_vehicles`: 0=ignore, 1=anti-armor only, 2=any weapon when no infantry threat is visible) and steer around driveable hulls and wrecks instead of walking into them or poisoning nav links (`avoid_vehicles`).
            * **Vehicle Pose Interpolation Fix:** The server now advances `m_flAnimTime` on driveable vehicles so clients interpolate wheel spin and steering poses. This fixes the stuttering wheels, the stuck front-wheel steering angle, and the "burnout" look on stopped Humvees.
            * **Push-Order Objective Targeting:** On Push maps, bots attack objectives in the engine's capture sequence instead of the nearest-to-home point (`push_order`).
            * **Cover System Performance:** Exposure checks are spatially indexed (22.04us to 0.20us per call) and the threat mask widened from 8 to 12 sectors, cutting the false "protected" rate from 11.10% to 3.88%.
            * **Source, Builds & Docs:** `bot.cpp` is split into 17 focused translation units (parallel MSVC builds, header-aware Linux builds), the repository ships a new `docs/` guide set and expanded unit tests, and the project is now licensed under GPL v3.0.

          files: |
            release_assets/insbots-windows-x86.zip
            release_assets/insbots-linux-i486.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
